<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猜词词库</title>
<style>
:root{
  --bg:#0f1116; --card:#181b23; --card2:#1f232d; --line:#2b303c;
  --txt:#e8eaf0; --dim:#98a0b3; --acc:#5b8cff; --p:#3fbf6a; --m:#d9a441;
  --bad:#e0616b; --over:#b06bff; --pick:#e0a63f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--txt);padding:0 0 80px;
  font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
.wrap{max-width:680px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,22,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px}
header .row1{display:flex;align-items:baseline;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.5px}
.stats{color:var(--dim);font-size:11.5px;flex:1}
h2{font-size:14px;margin:22px 0 10px;color:var(--dim);letter-spacing:.5px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,button,textarea{font-family:inherit;font-size:15px}
input[type=text],input[type=search],input[type=number],select,textarea{
  background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
  padding:10px 12px;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--dim);border:1px solid var(--line);font-weight:500;font-size:13px;padding:8px 12px}
button.mini{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--card2);color:var(--dim);border:1px solid var(--line);font-weight:500}
button.mini:active{background:var(--line)}
button.danger{color:var(--bad)}
.flex{display:flex;gap:8px;align-items:center}
.flex.wrapx{flex-wrap:wrap}
.err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:6px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{
  font-size:12.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
  background:var(--card2);color:var(--dim);cursor:pointer;user-select:none;
}
.chip.on{background:rgba(91,140,255,.18);border-color:var(--acc);color:#bcd0ff}
.chip.lv.on{background:rgba(91,140,255,.2);border-color:var(--acc);color:#bcd0ff}
.chip.over.on{background:rgba(176,107,255,.2);border-color:var(--over);color:#d8bcff}
.chip.pick.on{background:rgba(224,166,63,.2);border-color:var(--pick);color:#ffd899}
.chip.irr.on{background:rgba(47,184,184,.18);border-color:#2fb8b8;color:#9be8e8}
.hintbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;
  position:relative;overflow:hidden;isolation:isolate;scroll-margin-top:72px}
html{scroll-behavior:smooth}
.wcard>.wgrad{position:absolute;top:0;right:0;bottom:0;width:62%;z-index:0;pointer-events:none}
.wcard>.wtop,.wcard>.wmeta,.wcard>.acts{position:relative;z-index:1}
.wcard.flash{animation:fl 1.1s ease}
@keyframes fl{0%,100%{box-shadow:0 0 0 0 rgba(224,97,107,0)}25%{box-shadow:0 0 0 2px var(--bad)}75%{box-shadow:0 0 0 2px var(--bad)}}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sn{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);min-width:26px;font-weight:600;
  opacity:.8}
.word{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:1px}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.lv1{background:#1e3326;color:#7fd6a0}.lv2{background:#233024;color:#8fd0a0}
.lv3{background:#2b2f22;color:#cfd07f}.lv4{background:#332920;color:#e8b883}
.lv5{background:#341f22;color:#f08f96}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600}
.tag.over{background:rgba(176,107,255,.18);color:#cfaaff}
.tag.pick{background:rgba(224,166,63,.18);color:#ffd899}
.tag.irr{background:rgba(47,184,184,.18);color:#9be8e8}
.wmeta{color:var(--dim);font-size:11.5px;margin-top:4px}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
.memo-item{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.memo-item.done{opacity:.45}
.memo-item .idx{color:var(--dim);font-size:11px;min-width:18px}
.memo-item .mw{flex:1;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;font-size:15px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mask.solid{background:var(--bg);backdrop-filter:none}
.mask.solid>.dialog{max-width:520px}
.mask.center{align-items:center}
.sheet{background:var(--card);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:680px;max-height:88vh;overflow:auto}
.dialog{background:var(--card);border-radius:16px;padding:16px;width:calc(100% - 28px);max-width:420px;max-height:84vh;overflow:auto}
.sheet h3,.dialog h3{margin:0 0 12px;font-size:16px}
label.fl{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px}
.ans{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:700;text-align:center;
  padding:16px 8px;background:var(--card2);border-radius:12px;letter-spacing:2px;color:var(--dim);margin:12px 0}
.ans.hit{color:var(--p);font-size:20px}
.hist{list-style:none;padding:0;margin:0;max-height:34vh;overflow:auto}
.hist li{display:flex;gap:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;
  background:var(--card2);border-radius:8px;padding:7px 10px;margin-bottom:5px}
.hist .no{color:var(--dim);min-width:24px}
.hist .g{flex:1;letter-spacing:1px}
.hist em{color:var(--p);font-style:normal}.hist i{color:var(--m);font-style:normal}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b3242;color:#fff;
  padding:10px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
#btnTop{position:fixed;right:14px;bottom:18px;z-index:45;width:46px;height:46px;border-radius:50%;
  padding:0;font-size:19px;line-height:1;background:var(--card2);color:var(--txt);
  border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .18s,transform .18s}
#btnTop.on{opacity:1;pointer-events:auto;transform:none}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>猜词词库</h1>
    <span class="stats" id="stats">—</span>
    <button class="ghost" id="btnExport">导出</button>
    <button class="ghost" id="btnImport">导入</button>
  </div>
  <div class="flex" style="margin-top:8px">
    <input type="search" id="q" placeholder="搜索单词…" autocomplete="off">
  </div>
</header>

<div class="wrap">

  <h2>添加单词</h2>
  <div class="card">
    <div class="addrow">
      <input type="text" id="newWord" placeholder="输入单词（自动转小写）" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="btnAdd">添加</button>
    </div>
    <div class="err" id="addErr"></div>
    <div class="addrow" style="margin-top:8px">
      <input type="number" id="newLevel" step="0.1" placeholder="难度数字（可留空，如 15.5）" style="flex:1">
    </div>
    <div class="wmeta" style="margin-top:6px">难度写具体数字（越小越容易）。参考：zoo 11.4 · daddy 15.3 · pizza 15.5 · jazz 16.0 · deepseek 16.4</div>
    <div class="chips">
      <span class="chip over" data-tag="over">超纲</span>
      <span class="chip pick" data-tag="pick">精选</span>
      <span class="chip irr" data-tag="irr">非常规</span>
    </div>
  </div>

  <h2>备忘录 · 接下来要出的词</h2>
  <div class="card">
    <div class="addrow">
      <input type="text" id="memoInput" placeholder="手动加一个词到备忘录" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="btnMemoAdd">加入</button>
    </div>
    <div id="memoList" style="margin-top:12px"></div>
    <div class="flex" style="margin-top:6px">
      <button class="ghost" id="btnMemoClearDone">清除已出</button>
      <button class="ghost" id="btnMemoClear">清空备忘录</button>
    </div>
  </div>

  <details class="card" id="scaleBox" style="padding:12px 14px">
    <summary style="cursor:pointer;font-size:13px;color:var(--dim)">难度刻度参照表（来自 史.xlsx 的标准分档）</summary>
    <div id="scaleTable" style="margin-top:10px;font-size:12.5px;line-height:1.9"></div>
  </details>

  <h2>全部单词 <span id="shownCount" style="color:var(--dim);font-weight:400"></span></h2>
  <div class="hintbar">
    <select id="sortSel" style="width:auto">
      <option value="default">默认顺序（添加序）</option>
      <option value="level">按难度（数字高→低）</option>
      <option value="time">按时间</option>
      <option value="alpha">按首字母</option>
    </select>
    <span class="chip" id="fOver">不看超纲</span>
    <span class="chip" id="fPick">只看精选</span>
    <span class="chip" id="fIrr">不看非常规</span>
  </div>
  <div class="hintbar" style="align-items:center">
    <span style="font-size:12px;color:var(--dim)">长度</span>
    <input type="number" id="lenMin" min="1" max="30" placeholder="最少" style="width:70px;padding:7px 9px;font-size:13px">
    <span style="color:var(--dim);font-size:12px">–</span>
    <input type="number" id="lenMax" min="1" max="30" placeholder="最多" style="width:70px;padding:7px 9px;font-size:13px">
    <span class="chip" id="fClearLen" style="font-size:11.5px;padding:4px 9px">清空</span>
    <button class="mini" id="btnRandom" style="margin-left:auto">🎲 随机跳一个</button>
  </div>
  <div class="hintbar" style="align-items:center">
    <span style="font-size:12px;color:var(--dim)">难度</span>
    <input type="number" id="lvMin" step="0.1" placeholder="最少" style="width:70px;padding:7px 9px;font-size:13px">
    <span style="color:var(--dim);font-size:12px">–</span>
    <input type="number" id="lvMax" step="0.1" placeholder="最多" style="width:70px;padding:7px 9px;font-size:13px">
    <span class="chip" id="fClearLv" style="font-size:11.5px;padding:4px 9px">清空</span>
    <span class="lvhint" id="lvHint" style="font-size:11px;color:var(--dim)">区间生效时只显示已评分的词</span>
  </div>
  <div id="list"></div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" class="hide">

<div class="toast" id="toast"></div>
<button id="btnTop" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
(function(){
  var STORE = 'guessword.book.v1';
  var LEVELS = null; // 已取消档位，改为具体数字
  var SCALE = [
    [11.4,'zoo','难度下限参照'],
    [13.0,'rhythms',''],
    [13.5,'syncs','有一定排查能力'],
    [14.0,'thursday','一般长题'],
    [14.3,'turkey','基础盲选能力'],
    [14.7,'assess','大叠排查能力'],
    [15.0,'attract','排查多个叠的意识'],
    [15.3,'daddy','基础排除法'],
    [15.5,'pizza','进阶盲选能力'],
    [15.8,'attempt','需要基础逻辑推断和综合能力'],
    [16.0,'jazz','进阶排除法'],
    [16.3,'extreme','排查鬼故事的意识'],
    [16.5,'unknown','更少的信息'],
    [16.8,'extended','一般能藏一半字母'],
    [17.0,'bilibili','到处都是叠和罕见辅音'],
    [17.2,'cocacola','看完绷不住']
  ];

  var state = {
    words: [],      // {id, word, level(0-5|null), over, pick, created, note}
    memo: [],       // {id, word, done, level}
    sort: 'default',
    hideOver: false,
    onlyPick: false,
    hideIrr: false,
    lenMin: 0,
    lenMax: 0,
    lvMin: 0,
    lvMax: 0,
    q: '',
    pendingLevel: 0,
    pendingOver: false,
    pendingPick: false,
    pendingIrr: false
  };

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $('list'), statsEl = $('stats'), shownEl = $('shownCount');
  var newWord = $('newWord'), addErr = $('addErr');
  var memoListEl = $('memoList'), memoInput = $('memoInput');
  var toastEl = $('toast');
  var fileInput = $('fileInput');

  /* ---------------- 存取 ---------------- */
  function load(){
    try{
      var raw = localStorage.getItem(STORE);
      if(!raw) return;
      var d = JSON.parse(raw);
      state.words = d.words || [];
      state.memo = d.memo || [];
      state.sort = d.sort || 'default';
      state.hideOver = !!d.hideOver;
      state.onlyPick = !!d.onlyPick;
      state.hideIrr = !!d.hideIrr;
      state.lenMin = parseInt(d.lenMin, 10) || 0;
      state.lenMax = parseInt(d.lenMax, 10) || 0;
      state.lvMin = parseFloat(d.lvMin) || 0;
      state.lvMax = parseFloat(d.lvMax) || 0;
    }catch(e){}
  }
  function save(){
    try{
      localStorage.setItem(STORE, JSON.stringify({
        words: state.words, memo: state.memo,
        sort: state.sort, hideOver: state.hideOver, onlyPick: state.onlyPick,
        hideIrr: state.hideIrr,
        lenMin: state.lenMin, lenMax: state.lenMax,
        lvMin: state.lvMin, lvMax: state.lvMax
      }));
    }catch(e){ toast('保存失败：' + e.message); }
  }

  /* ---------------- 工具 ---------------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function norm(s){ return String(s||'').trim().toLowerCase(); }
  function lvName(v){ return draftLevel(v); }
  // 数字难度 → 显示文本
  function draftLevel(v){ return v ? String(v) : ''; }
  // 数字难度 → 颜色档（纯视觉，不代表原来那五档）
  function lvClass(v){
    if(!v) return '';
    if(v < 13.5) return 'lv1';
    if(v < 15) return 'lv2';
    if(v < 16) return 'lv3';
    if(v < 16.8) return 'lv4';
    return 'lv5';
  }
  function badgeHtml(v){
    if(!v) return '';
    return '<span class="badge ' + lvClass(v) + '">' + v + '</span>';
  }
  // 右半部分渐进染色：11（绿）→ 17.2（红）
  function gradCss(v){
    if(!v) return '';
    var t = (v - 11) / 6.2;
    if(t < 0) t = 0;
    if(t > 1) t = 1;
    // 绿 145 → 黄 55 → 红 0
    var hue = 145 - 145 * t;
    var sat = 62 + 18 * t;
    var a1 = 0.10 + 0.10 * t, a2 = 0.22 + 0.20 * t;
    return 'linear-gradient(90deg, hsla(' + hue + ',' + sat + '%,52%,0) 0%,'
         + ' hsla(' + hue + ',' + sat + '%,52%,' + a1.toFixed(2) + ') 40%,'
         + ' hsla(' + hue + ',' + sat + '%,52%,' + a2.toFixed(2) + ') 100%)';
  }
  function fmtDate(t){
    var d = new Date(t);
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.className = 'toast on';
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.className = 'toast'; }, 1600);
  }
  function findIndexByWord(w, exceptId){
    for(var i=0;i<state.words.length;i++){
      if(state.words[i].word === w && state.words[i].id !== exceptId) return i;
    }
    return -1;
  }
  function findById(id){
    for(var i=0;i<state.words.length;i++) if(state.words[i].id === id) return state.words[i];
    return null;
  }

  /* ---------------- 渲染：添加区 ---------------- */
  function renderAddLevels(){
    // 难度改为数字输入，这里只同步「超纲 / 精选」两个开关的样式
    var tags = document.querySelectorAll('.chip[data-tag]');
    for(var j=0;j<tags.length;j++){
      var t = tags[j].getAttribute('data-tag');
      var on;
      if(t === 'over') on = state.pendingOver;
      else if(t === 'pick') on = state.pendingPick;
      else if(t === 'irr') on = state.pendingIrr;
      else on = false;
      tags[j].className = 'chip ' + t + (on ? ' on' : '');
    }
  }

  function renderScale(){
    var box = $('scaleTable');
    if(!box) return;
    var html = '';
    for(var i=0;i<SCALE.length;i++){
      html += '<div><span style="font-family:ui-monospace,monospace;color:var(--p);display:inline-block;min-width:38px">'
        + SCALE[i][0].toFixed(1) + '</span>'
        + '<span style="font-family:ui-monospace,monospace;display:inline-block;min-width:76px;color:var(--txt)">'
        + SCALE[i][1] + '</span>'
        + '<span style="color:var(--dim)">' + SCALE[i][2] + '</span></div>';
    }
    box.innerHTML = html;
  }

  /* ---------------- 渲染：列表 ---------------- */
  function visibleWords(){
    var arr = state.words.slice();
    // 筛选
    arr = arr.filter(function(w){
      if(state.hideOver && w.over) return false;
      if(state.onlyPick && !w.pick) return false;
      if(state.hideIrr && w.irr) return false;
      if(state.q && w.word.indexOf(state.q) < 0) return false;
      if(state.lenMin && w.word.length < state.lenMin) return false;
      if(state.lenMax && w.word.length > state.lenMax) return false;
      // 难度区间：区间生效时，未评分的词（难度未知）不参与
      if(state.lvMin || state.lvMax){
        if(!w.level) return false;
        if(state.lvMin && w.level < state.lvMin - 1e-9) return false;
        if(state.lvMax && w.level > state.lvMax + 1e-9) return false;
      }
      return true;
    });
    // 排序
    if(state.sort === 'level'){
      arr.sort(function(a,b){
        var la = a.level || 0, lb = b.level || 0;
        if(lb !== la) return lb - la;
        return b.created - a.created;
      });
    } else if(state.sort === 'time'){
      arr.sort(function(a,b){ return b.created - a.created; });
    } else if(state.sort === 'alpha'){
      arr.sort(function(a,b){ return a.word < b.word ? -1 : (a.word > b.word ? 1 : 0); });
    } else {
      arr.sort(function(a,b){ return a.created - b.created; });
    }
    return arr;
  }

  function renderList(){
    var arr = visibleWords();
    shownEl.textContent = '(' + arr.length + ')';
    var lh = $('lvHint');
    if(lh){
      if(state.lvMin || state.lvMax){
        lh.textContent = '只看 ' + (state.lvMin || '—') + ' ~ ' + (state.lvMax || '—') + ' 分（已评分）';
        lh.style.color = 'var(--acc)';
      } else {
        lh.textContent = '区间生效时只显示已评分的词';
        lh.style.color = 'var(--dim)';
      }
    }
    if(arr.length === 0){
      listEl.innerHTML = '<div class="empty">' + (state.words.length ? '没有符合筛选条件的词' : '还没有词，先在上面加一个吧') + '</div>';
      return;
    }
    var html = '';
    for(var i=0;i<arr.length;i++){
      var w = arr[i];
      html += '<div class="wcard" data-id="' + w.id + '">';
      if(w.level) html += '<div class="wgrad" style="background:' + gradCss(w.level) + '"></div>';
      html += '<div class="wtop"><span class="sn">' + (i+1) + '</span><span class="word">' + esc(w.word) + '</span>';
      if(w.level) html += badgeHtml(w.level);
      if(w.over) html += '<span class="tag over">超纲</span>';
      if(w.pick) html += '<span class="tag pick">精选</span>';
      if(w.irr) html += '<span class="tag irr">非常规</span>';
      html += '</div>';
      html += '<div class="wmeta">' + w.word.length + ' 字母 · ' + fmtDate(w.created) + ' 添加'
            + (w.note ? ' · ' + esc(w.note) : '') + '</div>';
      html += '<div class="acts">'
        + '<button class="mini" data-act="play">给对方猜</button>'
        + '<button class="mini" data-act="memo">加入备忘录</button>'
        + '<button class="mini" data-act="edit">编辑</button>'
        + '<button class="mini danger" data-act="del">删除</button>'
        + '</div>';
      html += '</div>';
    }
    listEl.innerHTML = html;
    renderStats();
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderStats(){
    var over = 0, pick = 0, lv = 0, sum = 0, irr = 0;
    for(var i=0;i<state.words.length;i++){
      if(state.words[i].over) over++;
      if(state.words[i].pick) pick++;
      if(state.words[i].irr) irr++;
      if(state.words[i].level){ lv++; sum += state.words[i].level; }
    }
    var avg = lv ? (sum/lv).toFixed(2) : '—';
    statsEl.textContent = state.words.length + ' 词 · 已评 ' + lv + ' · 均 ' + avg
      + ' · 超纲 ' + over + ' · 精选 ' + pick + ' · 非常规 ' + irr;
  }

  /* ---------------- 渲染：备忘录 ---------------- */
  function renderMemo(){
    var m = state.memo;
    if(m.length === 0){
      memoListEl.innerHTML = '<div class="empty" style="padding:14px 0">备忘录是空的。点单词上的「加入备忘录」把接下来要出的词排好。</div>';
      return;
    }
    var html = '';
    for(var i=0;i<m.length;i++){
      var it = m[i];
      var wd = null;
      for(var k=0;k<state.words.length;k++) if(state.words[k].word === it.word) { wd = state.words[k]; break; }
      html += '<div class="memo-item' + (it.done ? ' done' : '') + '" data-mid="' + it.id + '">'
        + '<span class="idx">' + (i+1) + '</span>'
        + '<span class="mw">' + esc(it.word) + '</span>';
      if(wd && wd.level) html += badgeHtml(wd.level);
      html += '<button class="mini" data-mact="done">' + (it.done ? '已出' : '标记已出') + '</button>'
        + '<button class="mini" data-mact="up">↑</button>'
        + '<button class="mini" data-mact="down">↓</button>'
        + '<button class="mini" data-mact="play">猜</button>'
        + '<button class="mini danger" data-mact="del">移除</button>'
        + '</div>';
    }
    memoListEl.innerHTML = html;
  }

  /* ---------------- 增删改 ---------------- */
  function addWord(raw){
    var w = norm(raw);
    if(!w){ addErr.textContent = '先输入一个单词'; return; }
    if(!/^[a-z]+$/.test(w)){ addErr.textContent = '只能包含 26 个字母（不能有空格、数字、标点）'; return; }
    if(w.length > 30){ addErr.textContent = '太长了（最多 30 个字母，当前 ' + w.length + '）'; return; }
    var exist = findIndexByWord(w);
    if(exist >= 0){
      addErr.textContent = '「' + w + '」已经在词库里了（第 ' + (exist+1) + ' 个）';
      flashWord(state.words[exist].id);
      return;
    }
    var lvRaw = $('newLevel') ? $('newLevel').value : '';
    var lvNum = parseFloat(lvRaw);
    if(lvRaw !== '' && (isNaN(lvNum) || lvNum < 0 || lvNum > 99)){
      addErr.textContent = '难度要么留空，要么填一个数字（如 15.5）'; return;
    }
    var item = {
      id: uid(), word: w,
      level: (lvRaw === '' ? 0 : Math.round(lvNum*10)/10),
      over: state.pendingOver, pick: state.pendingPick, irr: state.pendingIrr,
      created: Date.now(), note: ''
    };
    state.words.push(item);
    save(); renderList();
    addErr.textContent = '';
    newWord.value = '';
    if($('newLevel')) $('newLevel').value = '';
    newWord.focus();
    toast('已添加 ' + w);
  }

  function flashWord(id){
    renderList();
    var el = listEl.querySelector('[data-id="' + id + '"]');
    if(el){
      el.className = 'wcard flash';
      el.scrollIntoView({block:'center', behavior:'smooth'});
    }
    return el;
  }

  /* ---------------- 随机跳一个 ---------------- */
  var lastRandomId = null;
  function randomPick(){
    var arr = visibleWords();
    if(arr.length === 0){ toast('当前筛选下没有词'); return; }
    var pick = arr[Math.floor(Math.random() * arr.length)];
    // 有多个候选时，尽量避免连续两次抽到同一个
    if(arr.length > 1 && pick.id === lastRandomId){
      var at = arr.indexOf(pick);
      pick = arr[(at + 1 + Math.floor(Math.random() * (arr.length - 1))) % arr.length];
    }
    var no = arr.indexOf(pick) + 1;
    lastRandomId = pick.id;
    flashWord(pick.id);
    toast('🎲 第 ' + no + ' 个：' + pick.word);
  }

  function delWord(id){
    var w = findById(id);
    if(!w) return;
    if(!confirm('删除「' + w.word + '」？')) return;
    var arr = [];
    for(var i=0;i<state.words.length;i++) if(state.words[i].id !== id) arr.push(state.words[i]);
    state.words = arr;
    save(); renderList(); renderMemo();
    toast('已删除');
  }

  /* ---------------- 编辑弹窗 ---------------- */
  var editId = null;
  function openEdit(id){
    var w = findById(id);
    if(!w) return;
    editId = id;
    var mask = document.createElement('div');
    mask.className = 'mask center';
    var html = '<div class="dialog">'
      + '<h3>编辑单词</h3>'
      + '<input type="text" id="eWord" value="' + esc(w.word) + '" autocapitalize="off" spellcheck="false">'
      + '<div class="err" id="eErr"></div>'
      + '<label class="fl">难度数字（留空=不评）</label>'
      + '<input type="number" id="eLevel" step="0.1" value="' + (w.level ? w.level : '') + '" placeholder="如 15.5">'
      + '<label class="fl">标记</label><div class="chips">'
      + '<span class="chip over' + (w.over?' on':'') + '" data-etag="over">超纲</span>'
      + '<span class="chip pick' + (w.pick?' on':'') + '" data-etag="pick">精选</span>'
      + '<span class="chip irr' + (w.irr?' on':'') + '" data-etag="irr">非常规</span>'
      + '</div>'
      + '<label class="fl">备注</label><textarea id="eNote" rows="2" placeholder="可选">' + esc(w.note||'') + '</textarea>'
      + '<div class="flex" style="margin-top:16px">'
      + '<button id="eSave" style="flex:1">保存</button>'
      + '<button class="ghost" id="eCancel">取消</button>'
      + '</div></div>';
    mask.innerHTML = html;
    document.body.appendChild(mask);

    var curOver = w.over, curPick = w.pick, curIrr = !!w.irr;

    mask.addEventListener('click', function(e){
      if(e.target === mask){ close(); return; }
      var tg = e.target.getAttribute && e.target.getAttribute('data-etag');
      if(tg === 'over'){ curOver = !curOver; e.target.className = 'chip over' + (curOver?' on':''); return; }
      if(tg === 'pick'){ curPick = !curPick; e.target.className = 'chip pick' + (curPick?' on':''); return; }
      if(tg === 'irr'){ curIrr = !curIrr; e.target.className = 'chip irr' + (curIrr?' on':''); return; }
      if(e.target.id === 'eSave'){ doSave(); return; }
      if(e.target.id === 'eCancel'){ close(); return; }
    });

    function doSave(){
      var nw = norm(mask.querySelector('#eWord').value);
      var errBox = mask.querySelector('#eErr');
      if(!/^[a-z]{1,30}$/.test(nw)){ errBox.textContent = '需要 1–30 个纯字母'; return; }
      var dup = findIndexByWord(nw, editId);
      if(dup >= 0){ errBox.textContent = '「' + nw + '」已存在于词库'; return; }
      var lvRaw = mask.querySelector('#eLevel').value;
      var lvNum = parseFloat(lvRaw);
      if(lvRaw !== '' && (isNaN(lvNum) || lvNum < 0 || lvNum > 99)){
        errBox.textContent = '难度要么留空，要么填数字'; return;
      }
      var it = findById(editId);
      it.word = nw;
      it.level = (lvRaw === '' ? 0 : Math.round(lvNum*10)/10);
      it.over = curOver; it.pick = curPick; it.irr = curIrr;
      it.note = mask.querySelector('#eNote').value.trim();
      save(); renderList(); renderMemo(); close();
      toast('已保存');
    }
    function close(){ document.body.removeChild(mask); editId = null; }
  }

  /* ---------------- 备忘录操作 ---------------- */
  function addMemo(word){
    word = norm(word);
    if(!word) return;
    for(var i=0;i<state.memo.length;i++){
      if(state.memo[i].word === word){ toast('备忘录里已有 ' + word); return; }
    }
    state.memo.push({id: uid(), word: word, done: false});
    save(); renderMemo();
    toast('已加入备忘录');
  }

  /* ---------------- 猜词模式 ---------------- */
  var game = null;
  function openGuess(word){
    game = { secret: norm(word), round: 0, over: false, log: [] };
    var mask = document.createElement('div');
    mask.className = 'mask center solid';
    mask.innerHTML = '<div class="dialog" style="max-height:94vh">'
      + '<h3>给对方猜 · ' + game.secret.length + ' 个字母</h3>'
      + '<div class="addrow"><input type="text" id="gIn" placeholder="输入猜测词" autocapitalize="off" spellcheck="false">'
      + '<button id="gOk">提交</button></div>'
      + '<div class="err" id="gErr"></div>'
      + '<div class="ans" id="gAns">—</div>'
      + '<ul class="hist" id="gHist"></ul>'
      + '<div class="flex" style="margin-top:12px">'
      + '<button class="ghost" id="gReveal" style="flex:1">看答案</button>'
      + '<button class="ghost" id="gClose" style="flex:1">关闭</button>'
      + '</div></div>';
    document.body.appendChild(mask);
    document.body.style.overflow = 'hidden';
    var gIn = mask.querySelector('#gIn'), gAns = mask.querySelector('#gAns'),
        gErr = mask.querySelector('#gErr'), gHist = mask.querySelector('#gHist');

    function judge(sec, gus){
      var inS = {};
      for(var i=0;i<sec.length;i++) inS[sec[i]] = true;
      var P = 0, M = 0;
      for(var j=0;j<sec.length;j++){
        if(gus[j] === sec[j]) P++;
        else if(inS[gus[j]]) M++;
      }
      return {P:P, M:M};
    }

    function submit(){
      if(game.over) return;
      var g = norm(gIn.value);
      if(!g) return;
      if(!/^[a-z]+$/.test(g)){ gErr.textContent = '只能输字母（不计轮次）'; return; }
      if(g.length !== game.secret.length){ gErr.textContent = '长度不符（应为 ' + game.secret.length + ' 个字母，不计轮次）'; return; }
      gErr.textContent = '';
      game.round++;
      var r = judge(game.secret, g);
      var li = document.createElement('li');
      li.innerHTML = '<span class="no">#' + game.round + '</span><span class="g">' + bodyEsc(g) + '</span>'
        + '<span>P=<em>' + r.P + '</em> M=<i>' + r.M + '</i></span>';
      gHist.appendChild(li);
      gHist.scrollTop = gHist.scrollHeight;
      if(g === game.secret){
        game.over = true;
        gAns.className = 'ans hit';
        gAns.textContent = '✅ 正确，第 ' + game.round + ' 轮';
      } else {
        gAns.className = 'ans';
        gAns.textContent = 'P=' + r.P + '　M=' + r.M;
      }
      gIn.value = '';
      gIn.focus();
    }
    function bodyEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    mask.querySelector('#gOk').addEventListener('click', submit);
    gIn.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
    mask.querySelector('#gReveal').addEventListener('click', function(){
      gAns.className = 'ans';
      gAns.textContent = '答案：' + game.secret;
    });
    function closeGuess(){
      if(mask.parentNode) mask.parentNode.removeChild(mask);
      document.body.style.overflow = '';
      game = null;
    }
    mask.querySelector('#gClose').addEventListener('click', closeGuess);
    mask.addEventListener('click', function(e){ if(e.target === mask){ closeGuess(); } });
    setTimeout(function(){ gIn.focus(); }, 50);
  }

  /* ---------------- 导入导出 ---------------- */
  function exportJSON(){
    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      words: state.words.map(function(w){
        return { word: w.word, difficulty: w.level || 0, level: w.level || 0,
                 over: !!w.over, pick: !!w.pick, irr: !!w.irr, created: w.created, note: w.note || '' };
      }),
      memo: state.memo.map(function(m){ return {word:m.word, done:!!m.done}; })
    };
    var txt = JSON.stringify(data, null, 2);
    var name = '词库-' + new Date().toISOString().slice(0,10) + '.json';
    try{
      var blob = new Blob([txt], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
      toast('已导出 ' + name);
    }catch(e){
      showText(txt, '导出失败，请手动复制：');
    }
  }

  function showText(txt, title){
    var mask = document.createElement('div');
    mask.className = 'mask center';
    mask.innerHTML = '<div class="dialog"><h3>' + title + '</h3>'
      + '<textarea id="txtBox" rows="12"></textarea>'
      + '<div class="flex" style="margin-top:10px"><button id="cp" style="flex:1">复制</button>'
      + '<button class="ghost" id="cc">关闭</button></div></div>';
    document.body.appendChild(mask);
    var box = mask.querySelector('#txtBox');
    box.value = txt;
    mask.querySelector('#cp').addEventListener('click', function(){
      box.select();
      try{ document.execCommand('copy'); toast('已复制'); }catch(e){}
    });
    mask.querySelector('#cc').addEventListener('click', function(){ document.body.removeChild(mask); });
  }

  function importJSON(text){
    var data;
    try{ data = JSON.parse(text); }catch(e){ toast('JSON 解析失败'); return; }
    var arr = null;
    if(Object.prototype.toString.call(data) === '[object Array]') arr = data;
    else if(data && data.words) arr = data.words;
    if(!arr){ toast('格式不认识：需要数组或 {words:[...]}'); return; }

    var merge = confirm('点「确定」= 合并到现有词库（跳过重复）\n点「取消」= 替换现有词库');
    if(!merge){
      state.words = [];
      state.memo = [];
    }
    var added = 0, skipped = 0;
    for(var i=0;i<arr.length;i++){
      var o = arr[i];
      var w = norm(typeof o === 'string' ? o : (o.word || o['单词'] || o['词'] || ''));
      if(!w || !/^[a-z]+$/.test(w)){ skipped++; continue; }
      if(findIndexByWord(w) >= 0){ skipped++; continue; }
      var rawLv = (o && (o.difficulty !== undefined ? o.difficulty : (o.level !== undefined ? o.level : o['难度'])));
      var fLv = parseFloat(rawLv);
      state.words.push({
        id: uid(), word: w,
        level: (isNaN(fLv) ? 0 : Math.round(fLv*10)/10),
        over: !!(o && (o.over || o['超纲'])),
        pick: !!(o && (o.pick || o['精选'])),
        irr: !!(o && (o.irr || o['非常规'])),
        created: (o && o.created) || (Date.now() + i),
        note: (o && (o.note || o['备注'] || o['短评'])) || ''
      });
      added++;
    }
    if(data && data.memo){
      for(var j=0;j<data.memo.length;j++){
        var mm = data.memo[j];
        var mw = norm(typeof mm === 'string' ? mm : mm.word);
        var has = false;
        for(var k=0;k<state.memo.length;k++) if(state.memo[k].word === mw) has = true;
        if(mw && !has) state.memo.push({id: uid(), word: mw, done: !!(mm && mm.done)});
      }
    }
    save(); renderList(); renderMemo();
    toast('导入完成：新增 ' + added + '，跳过 ' + skipped);
  }

  /* ---------------- 事件绑定 ---------------- */
  $('btnAdd').addEventListener('click', function(){ addWord(newWord.value); });
  newWord.addEventListener('keydown', function(e){ if(e.key === 'Enter') addWord(newWord.value); });

  document.addEventListener('click', function(e){
    var tg = e.target.getAttribute && e.target.getAttribute('data-tag');
    if(!tg) return;
    if(tg === 'over') state.pendingOver = !state.pendingOver;
    if(tg === 'pick') state.pendingPick = !state.pendingPick;
    if(tg === 'irr') state.pendingIrr = !state.pendingIrr;
    renderAddLevels();
  });

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if(!btn) return;
    var card = btn.closest('.wcard');
    var id = card.getAttribute('data-id');
    var w = findById(id);
    if(!w) return;
    var act = btn.getAttribute('data-act');
    if(act === 'del') delWord(id);
    else if(act === 'edit') openEdit(id);
    else if(act === 'memo') addMemo(w.word);
    else if(act === 'play') openGuess(w.word);
  });

  memoListEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-mact]') : null;
    if(!btn) return;
    var row = btn.closest('.memo-item');
    var mid = row.getAttribute('data-mid');
    var idx = -1;
    for(var i=0;i<state.memo.length;i++) if(state.memo[i].id === mid) idx = i;
    if(idx < 0) return;
    var act = btn.getAttribute('data-mact');
    if(act === 'done'){ state.memo[idx].done = !state.memo[idx].done; }
    else if(act === 'del'){ state.memo.splice(idx,1); }
    else if(act === 'up' && idx > 0){ var t = state.memo[idx-1]; state.memo[idx-1] = state.memo[idx]; state.memo[idx] = t; }
    else if(act === 'down' && idx < state.memo.length-1){ var t2 = state.memo[idx+1]; state.memo[idx+1] = state.memo[idx]; state.memo[idx] = t2; }
    else if(act === 'play'){ openGuess(state.memo[idx].word); return; }
    save(); renderMemo();
  });

  $('btnMemoAdd').addEventListener('click', function(){
    addMemo(memoInput.value);
    memoInput.value = '';
  });
  memoInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ addMemo(memoInput.value); memoInput.value = ''; } });
  $('btnMemoClearDone').addEventListener('click', function(){
    var arr = [];
    for(var i=0;i<state.memo.length;i++) if(!state.memo[i].done) arr.push(state.memo[i]);
    state.memo = arr; save(); renderMemo();
  });
  $('btnMemoClear').addEventListener('click', function(){
    if(!confirm('清空整个备忘录？')) return;
    state.memo = []; save(); renderMemo();
  });

  $('sortSel').addEventListener('change', function(){
    state.sort = this.value; save(); renderList();
  });
  $('fOver').addEventListener('click', function(){
    state.hideOver = !state.hideOver;
    this.className = 'chip' + (state.hideOver ? ' on' : '');
    save(); renderList();
  });
  $('fPick').addEventListener('click', function(){
    state.onlyPick = !state.onlyPick;
    this.className = 'chip' + (state.onlyPick ? ' on' : '');
    save(); renderList();
  });
  $('fIrr').addEventListener('click', function(){
    state.hideIrr = !state.hideIrr;
    this.className = 'chip' + (state.hideIrr ? ' on' : '');
    save(); renderList();
  });
  $('q').addEventListener('input', function(){
    state.q = norm(this.value); renderList();
  });
  $('lenMin').addEventListener('input', function(){
    state.lenMin = parseInt(this.value, 10) || 0; save(); renderList();
  });
  $('lenMax').addEventListener('input', function(){
    state.lenMax = parseInt(this.value, 10) || 0; save(); renderList();
  });
  $('fClearLen').addEventListener('click', function(){
    state.lenMin = 0; state.lenMax = 0;
    $('lenMin').value = ''; $('lenMax').value = '';
    save(); renderList();
  });
  function readLv(input){
    var v = input.value.trim();
    if(v === '') return 0;
    var n = parseFloat(v);
    return isNaN(n) ? 0 : Math.round(n*100)/100;
  }
  $('lvMin').addEventListener('input', function(){
    state.lvMin = readLv(this); save(); renderList();
  });
  $('lvMax').addEventListener('input', function(){
    state.lvMax = readLv(this); save(); renderList();
  });
  $('fClearLv').addEventListener('click', function(){
    state.lvMin = 0; state.lvMax = 0;
    $('lvMin').value = ''; $('lvMax').value = '';
    save(); renderList();
  });
  $('btnRandom').addEventListener('click', randomPick);

  /* 回到顶部 */
  var btnTop = $('btnTop');
  var topTick = false;
  function syncTopBtn(){
    topTick = false;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if(y > 420) btnTop.classList.add('on');
    else btnTop.classList.remove('on');
  }
  window.addEventListener('scroll', function(){
    if(!topTick){ topTick = true; setTimeout(syncTopBtn, 100); }
  }, {passive:true});
  btnTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
  syncTopBtn();

  $('btnExport').addEventListener('click', exportJSON);
  $('btnImport').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){ importJSON(String(fr.result)); fileInput.value = ''; };
    fr.readAsText(f);
  });

  /* ---------------- 启动 ---------------- */
  load();
  $('sortSel').value = state.sort;
  if(state.hideOver) $('fOver').className = 'chip on';
  if(state.onlyPick) $('fPick').className = 'chip on';
  if(state.hideIrr) $('fIrr').className = 'chip on';
  if(state.lenMin) $('lenMin').value = state.lenMin;
  if(state.lenMax) $('lenMax').value = state.lenMax;
  if(state.lvMin) $('lvMin').value = state.lvMin;
  if(state.lvMax) $('lvMax').value = state.lvMax;
  renderAddLevels();
  renderScale();
  renderList();
  renderMemo();
})();
</script>
</body>
</html>
